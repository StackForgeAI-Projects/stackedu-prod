name: Merge development into main

# Merges `development` into `main` without bringing docs, context, or
# design-system paths. Run this after CodeRabbit approves the PR.
# Do not use GitHub's Merge button for development → main.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Filtered merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin development main
          git checkout main
          git merge origin/development --no-ff --no-commit || true

          paths=(
            docs
            ems/docs
            ems/context
            ems/design_system
            ems/EMS-master-context.md
            stackedu-app-frontend-design
            code-standards.md
          )
          for p in "${paths[@]}"; do
            git rm -rf --ignore-unmatch "$p" || true
            rm -rf "$p"
          done

          if git diff --cached --quiet && git diff --quiet; then
            if git diff --cached --diff-filter=U | grep -q .; then
              echo "Unresolved conflicts remain."
              git status
              exit 1
            fi
          fi

          git add -A
          for p in "${paths[@]}"; do
            git rm -rf --ignore-unmatch "$p" || true
          done

          git commit -m "Merge branch 'development' into main (without docs/context/design)."
          git push origin main
