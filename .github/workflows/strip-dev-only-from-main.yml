name: Strip development-only paths from main

# Does not push to main. Opens a pull request so production still
# requires review. Temporary branch: auto/strip-dev-only.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: strip-dev-only-from-main
  cancel-in-progress: false

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Open a pull request if main has development-only paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          paths=(
            docs
            ems/docs
            ems/context
            ems/design_system
            ems/EMS-master-context.md
            stackedu-app-frontend-design
            code-standards.md
          )
          found=0
          for p in "${paths[@]}"; do
            if [ -e "$p" ]; then
              found=1
              break
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "Main tree is clean."
            exit 0
          fi

          existing="$(gh pr list --base main --head auto/strip-dev-only --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Cleanup PR #$existing is already open. It waits for a person to press Merge."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B auto/strip-dev-only
          for p in "${paths[@]}"; do
            git rm -rf --ignore-unmatch "$p"
          done
          git commit -m "chore: remove development-only docs, context, and design from main."
          git push --force origin auto/strip-dev-only
          gh pr create --base main --head auto/strip-dev-only \
            --title "Remove development-only docs, context, and design from main" \
            --body "$(cat <<'EOF'
          These folders belong on `development` only. This PR removes them from `main` after a production merge.

          Review this PR, then press Merge. It does not merge by itself.
          EOF
          )"
