<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buttons — Primary states</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .tok { display: flex; flex-direction: column; gap: 8px; }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); }
  .btn {
    height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid transparent;
    font-family: var(--font-sans); font-size: 14px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer; transition: all 120ms var(--ease-in-out);
    background: var(--brand); color: var(--brand-ink);
  }
  .btn.hover { background: #0CE03E; }
  .btn.focus { box-shadow: var(--shadow-focus); }
  .btn.disabled { opacity: 0.5; cursor: not-allowed; }
  .btn .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin 600ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="grid">
    <div class="tok"><span class="lbl">default</span><button class="btn">Pay fees</button></div>
    <div class="tok"><span class="lbl">hover</span><button class="btn hover">Pay fees</button></div>
    <div class="tok"><span class="lbl">focus</span><button class="btn focus">Pay fees</button></div>
    <div class="tok"><span class="lbl">disabled</span><button class="btn disabled">Pay fees</button></div>
    <div class="tok"><span class="lbl">loading</span><button class="btn"><span class="spinner"></span>Processing</button></div>
    <div class="tok"><span class="lbl">small (32h)</span><button class="btn" style="height:32px; padding:0 12px; font-size:13px; border-radius:10px;">Save</button></div>
    <div class="tok"><span class="lbl">large (48h)</span><button class="btn" style="height:48px; padding:0 20px; font-size:15px; border-radius:14px;">Continue</button></div>
    <div class="tok"><span class="lbl">icon + text</span><button class="btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download receipt</button></div>
    <div class="tok"><span class="lbl">text + icon</span><button class="btn">Continue<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button></div>
    <div class="tok"><span class="lbl">icon‑only</span><button class="btn" style="width:40px; padding:0; border-radius:12px;" aria-label="Add"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button></div>
  </div>
</div>
</body>
</html>
