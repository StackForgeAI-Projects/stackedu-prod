<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type — Headings (Clash Grotesk)</title>
<link rel="stylesheet" href="_card.css">
<style>
  .specimen { display: grid; grid-template-columns: 90px 1fr; column-gap: 24px; row-gap: 14px; align-items: baseline; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); white-space: nowrap; padding-top: 8px; }
  .sample { font-family: var(--font-display); color: var(--foreground); text-wrap: balance; }
</style>
</head>
<body>
<div class="card">
  <div class="specimen">
    <div class="meta">48 · 700</div>
    <div class="sample" style="font-size:48px; font-weight:700; line-height:1.1; letter-spacing:-0.02em;">Centralised academic infrastructure</div>
    <div class="meta">32 · 700</div>
    <div class="sample" style="font-size:32px; font-weight:700; line-height:1.2; letter-spacing:-0.015em;">Course registration is open</div>
    <div class="meta">24 · 700</div>
    <div class="sample" style="font-size:24px; font-weight:700; line-height:1.3; letter-spacing:-0.01em;">Results published 12 Dec</div>
    <div class="meta">18 · 600</div>
    <div class="sample" style="font-size:18px; font-weight:600; line-height:1.4;">Semester 2 · 2025/26</div>
  </div>
</div>
</body>
</html>
