<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>StackEDU user guides</title>
    <meta
      name="description"
      content="Standalone StackEDU role guides for applicants, students, lecturers, academic admins, bursars, librarians, and ICT managers."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#guide">Skip to guide</a>

    <div class="app">
      <header class="topbar">
        <a class="brand" href="./">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-text">
            <span class="brand-name">StackEDU</span>
            <span class="brand-sub">User guides</span>
          </span>
        </a>
        <button
          type="button"
          class="menu-btn"
          id="menu-btn"
          aria-controls="sidenav"
          aria-expanded="false"
        >
          Menu
        </button>
      </header>

      <div class="shell">
        <div class="nav-backdrop" id="nav-backdrop" hidden></div>
        <aside class="sidenav" id="sidenav" aria-label="Role guides">
          <p class="nav-label">Choose a guide</p>
          <nav id="guide-nav"></nav>
        </aside>

        <main class="main">
          <article class="prose" id="guide" aria-live="polite">
            <p class="loading">Loading guide…</p>
          </article>
        </main>
      </div>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
