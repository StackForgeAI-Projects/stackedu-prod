# Render Blueprint — creates the API service and its cache in one step.
#
# The frontend is NOT here: it is served by Vercel at app.stackedu.rw and
# app.stackedu.africa. This file provisions the backend that both of those
# domains talk to.
#
# When this monorepo lives inside stackedu-prod as `ems/`, set the Render
# service Root Directory to `ems` so `rootDir: .` below means this folder.
#
# Frankfurt is chosen because the database lives there too. Keeping the API and
# the database in the same region matters far more than moving the API closer
# to Kigali, since one page can make several database calls but only one trip
# to the user.

services:
  - type: web
    name: stackedu-api
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    rootDir: .
    buildCommand: bun install --frozen-lockfile && bun run --filter '@stackedu/api' build && bun run --filter '@stackedu/api' db:migrate
    startCommand: node apps/api/dist/index.js
    # Liveness only — deliberately does not touch the database, so a brief
    # database problem cannot cause Render to restart a healthy container.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: LOG_LEVEL
        value: info
      - key: ALLOWED_ORIGINS
        value: https://app.stackedu.rw,https://app.stackedu.africa
      - key: COOKIE_DOMAIN
        value: .stackedu.rw
      - key: DB_POOL_MAX_CONNECTIONS
        value: 5
      - key: DB_POOL_IDLE_TIMEOUT_SECONDS
        value: 300
      # Set in the Render dashboard, never in this file.
      - key: PLATFORM_DATABASE_URL
        sync: false
      - key: ADMIN_DATABASE_URL
        sync: false
      - key: APP_VERSION
        fromService:
          type: web
          name: stackedu-api
          property: commit
      # Set in the Render dashboard (Resend).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: WEB_APP_URL
        value: https://app.stackedu.rw
      # Set in the Render dashboard (LiveKit Cloud).
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: HOCUSPOCUS_URL
        sync: false
      - key: COLLAB_SECRET
        sync: false

  - type: web
    name: stackedu-collab
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    rootDir: .
    buildCommand: bun install --frozen-lockfile && bun run --filter '@stackedu/api' build
    startCommand: node apps/api/dist/collab.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: COLLAB_PORT
        value: 8081
      - key: LOG_LEVEL
        value: info
      - key: PLATFORM_DATABASE_URL
        sync: false
      - key: ADMIN_DATABASE_URL
        sync: false
      - key: STORAGE_DRIVER
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: COLLAB_SECRET
        sync: false

  # Cache and rate limiting. On Render's private network in the same region, so
  # there is no public internet hop.
  - type: keyvalue
    name: stackedu-cache
    region: frankfurt
    plan: starter
    ipAllowList: []
