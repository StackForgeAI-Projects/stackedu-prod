<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar — Active state variants</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { background: var(--background); }
  .frame { display: grid; grid-template-columns: 248px 72px; gap: 16px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 24px; }
  .row-pair { display: flex; gap: 24px; }
  .col-pair { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
  .style-label { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); }

  .sidebar { background: var(--ink); color: var(--ink-foreground); border-radius: 18px; padding: 16px 12px; display: flex; flex-direction: column; gap: 18px; }
  .sidebar.exp { width: 248px; }
  .sidebar.col { width: 72px; align-items: center; padding: 16px 8px; }

  .brand-row { display: flex; align-items: center; gap: 12px; padding: 4px 8px; }
  .brand-mark { width: 36px; height: 36px; border-radius: 10px; background: var(--ink-surface); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand-mark img { width: 26px; height: 26px; object-fit: contain; }
  .brand-name { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; color: var(--ink-foreground); line-height: 1; }

  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav-item { display: flex; align-items: center; gap: 14px; padding: 11px 14px; border-radius: 99px; color: var(--ink-muted); font: 500 14px/1 var(--font-sans); cursor: pointer; }
  .nav-item.col { justify-content: center; padding: 12px; width: 48px; height: 48px; border-radius: 14px; gap: 0; }
  .nav-item:hover { background: var(--ink-surface); color: var(--ink-foreground); }
  .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }

  /* Style A — solid brand pill */
  .style-a .active { background: var(--brand); color: var(--brand-ink); font-weight: 600; }

  /* Style B — tinted brand pill (icon + text in brand green) */
  .style-b .active { background: rgba(32, 244, 78, 0.12); color: var(--brand); font-weight: 600; }
  .style-b .nav-item.col.active { border-radius: 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="stack">

    <!-- Style A — solid pill -->
    <div class="col-pair">
      <span class="style-label">Style A · Solid brand pill</span>
      <div class="frame style-a">
        <div class="sidebar exp">
          <div class="brand-row">
            <div class="brand-mark"><img src="../assets/logo-mark-on-dark.png" alt=""></div>
            <span class="brand-name">StackEDU</span>
          </div>
          <div class="nav">
            <div class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard</div>
            <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>Courses</div>
            <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>Library</div>
            <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>Fees</div>
          </div>
        </div>
        <div class="sidebar col">
          <div class="brand-mark"><img src="../assets/logo-mark-on-dark.png" alt="" style="width:26px; height:26px;"></div>
          <div class="nav">
            <div class="nav-item col active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg></div>
            <div class="nav-item col"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div>
            <div class="nav-item col"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg></div>
            <div class="nav-item col"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Style B — tinted pill -->
    <div class="col-pair">
      <span class="style-label">Style B · Tinted brand pill</span>
      <div class="frame style-b">
        <div class="sidebar exp">
          <div class="brand-row">
            <div class="brand-mark"><img src="../assets/logo-mark-on-dark.png" alt=""></div>
            <span class="brand-name">StackEDU</span>
          </div>
          <div class="nav">
            <div class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard</div>
            <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>Courses</div>
            <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>Library</div>
            <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>Fees</div>
          </div>
        </div>
        <div class="sidebar col">
          <div class="brand-mark"><img src="../assets/logo-mark-on-dark.png" alt="" style="width:26px; height:26px;"></div>
          <div class="nav">
            <div class="nav-item col active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg></div>
            <div class="nav-item col"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div>
            <div class="nav-item col"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg></div>
            <div class="nav-item col"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg></div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
