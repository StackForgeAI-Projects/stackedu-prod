<!-- @dsCard group="Type" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type — Mono (JetBrains Mono)</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row-line { display: flex; align-items: center; gap: 16px; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card); }
  .row-line + .row-line { margin-top: 8px; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted-foreground); width: 130px; flex-shrink: 0; }
  .mono { font-family: var(--font-mono); font-size: 13px; color: var(--foreground); }
</style>
</head>
<body>
<div class="card">
  <div>
    <div class="row-line">
      <span class="label">Student ID</span>
      <span class="mono">STU‑2024‑0481</span>
    </div>
    <div class="row-line">
      <span class="label">Course code</span>
      <span class="mono">SE401 · CS304 · MTH210</span>
    </div>
    <div class="row-line">
      <span class="label">Payment ref</span>
      <span class="mono">PAY‑2026‑002841</span>
    </div>
    <div class="row-line">
      <span class="label">Phone</span>
      <span class="mono">+250 78 234 5678</span>
    </div>
  </div>
  <div class="note">JetBrains Mono · 13px / 400. Always uppercase, hyphenated. Reserved for IDs, codes and machine‑readable references.</div>
</div>
</body>
</html>
